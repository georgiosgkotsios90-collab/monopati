name: Daily update

on:
  schedule:
    # 08:00 ώρα Ελλάδας: 06:00 UTC τον χειμώνα, 05:00 UTC το καλοκαίρι.
    # Τρέχουν και τα δύο. Το βήμα «Check time» αφήνει να συνεχίσει μόνο αυτό που πέφτει μετά τις 08:00
    # και μόνο αν δεν έχει γίνει ήδη ενημέρωση σήμερα μετά τις 08:00.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:       # επιτρέπει και χειροκίνητη εκτέλεση

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Check time
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          HOUR=$((10#$(TZ=Europe/Athens date +%H)))
          TODAY=$(TZ=Europe/Athens date +%F)
          LAST=$(git log -1 --format=%ct -- data.enc 2>/dev/null); LAST=${LAST:-0}
          LAST_DAY=$(TZ=Europe/Athens date -d "@$LAST" +%F)
          LAST_HOUR=$((10#$(TZ=Europe/Athens date -d "@$LAST" +%H)))
          if [ "$HOUR" -lt 8 ]; then echo "Νωρίτερα από τις 08:00 ώρα Ελλάδας, παράλειψη."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$LAST_DAY" = "$TODAY" ] && [ "$LAST_HOUR" -ge 8 ]; then echo "Έγινε ήδη ενημέρωση σήμερα, παράλειψη."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Update plan
        if: steps.gate.outputs.run == 'true'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update.py

      - name: Save encrypted data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "monopati-bot"
          git config user.email "monopati-bot@users.noreply.github.com"
          git add data.enc
          git diff --cached --quiet || (git commit -m "Daily update" && git push)

      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Monopati failed" -d "Η αυτόματη ενημέρωση απέτυχε. Δες το Actions στο GitHub." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
